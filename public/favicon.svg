<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e6d7bc" />
      <stop offset="100%" stop-color="#a68e68" />
    </radialGradient>
    <radialGradient id="brass" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f2d283" />
      <stop offset="70%" stop-color="#a67c29" />
      <stop offset="100%" stop-color="#573f0f" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#1a1614"/>
  <circle cx="256" cy="270" r="200" fill="url(#bg)" stroke="#4d3608" stroke-width="16"/>
  <!-- Top bell cap -->
  <path d="M 216 70 C 216 40, 296 40, 296 70 Z" fill="url(#brass)" stroke="#4d3608" stroke-width="10"/>
  <!-- Inner dial display -->
  <circle cx="256" cy="270" r="140" fill="#faedd7" stroke="#b88b2a" stroke-width="12"/>
  <!-- Dial hand indicator -->
  <line x1="256" y1="270" x2="256" y2="160" stroke="#a8582d" stroke-width="18" stroke-linecap="round"/>
  <circle cx="256" cy="270" r="30" fill="url(#brass)" stroke="#4d3608" stroke-width="6"/>
</svg>
