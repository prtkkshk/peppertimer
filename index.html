<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minimal Stopwatch</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stopwatch">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app" class="app-container">
    
    <!-- Top Header Bar -->
    <header class="top-header">
      <h1 class="app-title">STOPWATCH</h1>

      <div class="header-actions">
        <button id="fullscreen-btn" class="icon-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
          <svg id="fullscreen-icon" class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Central Display -->
    <main class="main-display">
      <div class="time-readout">
        <span id="time-main" class="time-main">00:00:00</span><span id="time-sub" class="time-sub">.0</span>
      </div>
    </main>

    <!-- Action Buttons -->
    <footer class="controls-footer">
      <button id="start-btn" class="btn primary-btn">START</button>
      <button id="reset-btn" class="btn secondary-btn">RESET</button>
    </footer>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
